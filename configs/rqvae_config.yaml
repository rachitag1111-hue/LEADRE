# Configuration for Ad Indexing via RQ-VAE (Section 3.2 & Section 5.1.3)
rqvae:
  d_plm: 64            # Output dimension of PLM text encoder
  d_rq: 8              # Hidden embedding dimension for RQ-VAE
  num_layers: 4        # Number of quantization layers (M = 4)
  codebook_size: 1024  # Codebook vectors per layer (K = 1024)
  beta_quant: 0.25     # Commitment loss factor
  epochs: 30           # Number of training epochs
  lr: 0.01             # Learning rate
  seed: 42

disambiguation:
  sid_length: 5        # M + 1 (4 RQ-VAE tokens + 1 disambiguation token)
  prefixes: ["a_", "b_", "c_", "d_", "e_"]
